<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋魂 - 永远的神之一手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif SC', serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            background: #000;
        }
        
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), 
                        url('https://images.alphacoders.com/756/756799.jpg') center/cover no-repeat;
            z-index: -2;
        }
        
        .go-board-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(transparent 50%, rgba(255,255,255,0.03) 50%),
                        linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.03) 50%);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.6;
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        h1 { font-size: 4.8rem; text-shadow: 0 0 30px #ffd700; letter-spacing: 10px; }
        .subtitle { font-size: 1.9rem; margin: 15px 0 40px; opacity: 0.9; }

        /* 背景音乐播放器 */
        .bg-music {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border: 2px solid #ffd700;
            border-radius: 50px;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 0 25px rgba(255,215,0,0.6);
        }
        
        .music-info {
            color: #ffd700;
            font-size: 1rem;
            white-space: nowrap;
        }
        
        audio { display: none; } /* 隐藏默认控件 */
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="go-board-overlay"></div>

    <div class="container">
        <h1>棋魂</h1>
        <p class="subtitle">ヒカルの碁</p>
    </div>

    <!-- 背景音乐 -->
    <div class="bg-music">
        <span class="music-info">♪ Dream - Get Over ♪</span>
        <audio id="bgm" loop preload="auto">
            <!-- 公开可用的棋魂主题曲直链（可替换成你自己上传的） -->
            <source src="https://cdn.jsdelivr.net/gh/nekoweb/ost@master/hikaru-no-go/get-over.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
        
        <button id="playBtn" style="background:#ffd700; color:#000; border:none; padding:8px 20px; border-radius:30px; cursor:pointer; font-weight:bold;">
            ▶ 播放音乐
        </button>
    </div>

    <script>
        const audio = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');

        // 尝试自动播放
        function tryAutoplay() {
            audio.volume = 0.6;  // 设置音量 60%
            audio.play().then(() => {
                playBtn.textContent = '❚❚ 暂停';
            }).catch(() => {
                // 浏览器阻止自动播放，等待用户交互
                console.log('自动播放被浏览器阻止，等待用户点击');
            });
        }

        // 页面加载后尝试自动播放
        window.addEventListener('load', () => {
            tryAutoplay();
        });

        // 点击任意位置也可以触发播放（强烈推荐）
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚ 暂停';
            }
        }, { once: true }); // 只触发一次

        // 播放/暂停按钮
        playBtn.addEventListener('click', (e) => {
            e.stopImmediatePropagation();
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚ 暂停';
            } else {
                audio.pause();
                playBtn.textContent = '▶ 播放音乐';
            }
        });

        console.log('%c棋魂背景音乐已加载 ✨', 'color:#ffd700; font-size:16px;');
    </script>
</body>
</html>
