<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李白 · 侠客行</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat fixed;
            color: #f5e8c7;
            overflow-x: hidden;
        }
        
        .poem-container {
            background: rgba(20, 20, 30, 0.85);
            border: 2px solid #b8860b;
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.5);
        }
        
        .character-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.15;
            overflow: hidden;
        }
        
        .floating-char {
            position: absolute;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
            animation: float 25s linear infinite;
            user-select: none;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }
        
        .title {
            text-shadow: 0 0 20px #b8860b,
                         0 0 40px #ffd700;
        }
        
        .poem-line {
            transition: all 0.3s ease;
        }
        
        .poem-line:hover {
            color: #ffd700;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
    <div class="character-bg" id="char-bg"></div>
    
    <div class="max-w-3xl mx-auto poem-container rounded-2xl p-12 backdrop-blur-md">
        <div class="text-center mb-12">
            <h1 class="title text-6xl font-bold tracking-widest mb-2 text-amber-300">侠客行</h1>
            <p class="text-xl text-amber-200">李白</p>
        </div>
        
        <div class="space-y-6 text-lg leading-relaxed text-center" id="poem">
            <!-- Poem lines will be populated by JS -->
        </div>
        
        <div class="mt-16 pt-8 border-t border-amber-700 text-center text-sm opacity-75">
            <p>十步杀一人，千里不留行。</p>
            <p class="mt-6 text-amber-400 italic">"事了拂衣去，深藏身与名。"</p>
        </div>
    </div>

    <script>
        // Poem content
        const poem = [
            "赵客缦胡缨，吴钩霜雪明。",
            "银鞍照白马，飒沓如流星。",
            "十步杀一人，千里不留行。",
            "事了拂衣去，深藏身与名。",
            "闲过信陵饮，脱剑膝前横。",
            "将炙啖朱亥，持觞劝侯嬴。",
            "三杯吐然诺，五岳倒为轻。",
            "眼花耳热后，意气素霓生。",
            "救赵挥金锤，邯郸先震惊。",
            "千秋二壮士，烜赫大梁城。",
            "纵死侠骨香，不惭世上英。",
            "谁能书阁下，白首太玄经。"
        ];
        
        // Populate poem
        const poemContainer = document.getElementById('poem');
        poem.forEach(line => {
            const div = document.createElement('div');
            div.className = 'poem-line text-2xl py-1';
            div.textContent = line;
            poemContainer.appendChild(div);
        });
        
        // Generate floating Chinese characters for background
        function createFloatingChars() {
            const chars = ['侠', '剑', '客', '马', '酒', '赵', '吴', '银', '霜', '杀', '行', '名', '英', '壮', '骨', '香'];
            const bg = document.getElementById('char-bg');
            
            for (let i = 0; i < 35; i++) {
                const char = document.createElement('div');
                char.className = 'floating-char';
                char.textContent = chars[Math.floor(Math.random() * chars.length)];
                
                // Random positioning and animation delay
                char.style.left = Math.random() * 100 + 'vw';
                char.style.animationDuration = (20 + Math.random() * 25) + 's';
                char.style.animationDelay = '-' + Math.random() * 30 + 's';
                char.style.opacity = 0.3 + Math.random() * 0.6;
                char.style.fontSize = (1.8 + Math.random() * 2.2) + 'rem';
                
                bg.appendChild(char);
            }
        }
        
        // Initialize floating characters
        createFloatingChars();
        
        // Add some subtle interactivity
        document.addEventListener('mousemove', (e) => {
            const chars = document.querySelectorAll('.floating-char');
            chars.forEach((char, index) => {
                const speed = (index % 5) * 0.02 + 0.01;
                const x = (e.clientX - window.innerWidth / 2) * speed;
                const y = (e.clientY - window.innerHeight / 2) * speed;
                char.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
